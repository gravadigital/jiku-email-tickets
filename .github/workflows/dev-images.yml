name: Dev images

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: dev-images
  cancel-in-progress: false

env:
  REGISTRY_NAMESPACE: gravadigital

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:teardown

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY_NAMESPACE }}/jiku-email-tickets:dev
            ${{ env.REGISTRY_NAMESPACE }}/jiku-email-tickets:dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=jiku-email-tickets
            org.opencontainers.image.vendor=Grava Digital
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=jiku-email-tickets
          cache-to: type=gha,mode=max,scope=jiku-email-tickets

  summary:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [[ "${{ needs.publish.result }}" != "success" ]]; then
            echo "::error::The dev image failed to publish."
            exit 1
          fi
          echo "Published dev and dev-${GITHUB_SHA} for jiku-email-tickets."
