name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_NAMESPACE: gravadigital

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # version.txt is what .gitlab-ci.yml publishes from main. A tag that disagrees with it would
      # put the same version number on two different images, one per registry.
      - name: The tag must match version.txt
        run: |
          version="${{ steps.version.outputs.version }}"
          file="$(tr -d '[:space:]' < version.txt)"
          if [[ "${file}" != "${version}" ]]; then
            echo "::error::The tag is v${version} but version.txt says ${file}. Bump version.txt, commit and re-tag."
            exit 1
          fi

      # The CHANGELOG is the release record: a tag without its section is a release nobody can read.
      - name: The tag must have its CHANGELOG section
        run: |
          version="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section [${version}]. Move [Unreleased] to it, commit and re-tag."
            exit 1
          fi

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:teardown

  publish:
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_NAMESPACE }}/jiku-email-tickets
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=jiku-email-tickets
            org.opencontainers.image.vendor=Grava Digital

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=jiku-email-tickets
          cache-to: type=gha,mode=max,scope=jiku-email-tickets

  summary:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [[ "${{ needs.publish.result }}" != "success" ]]; then
            echo "::error::The image failed to publish. Check the publish job before announcing ${GITHUB_REF_NAME}."
            exit 1
          fi
          echo "Published ${GITHUB_REF_NAME}: gravadigital/jiku-email-tickets."
